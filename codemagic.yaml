workflows:
  cinear-preflight:
    name: CineAR - Unsigned Preflight (No TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 30
    # Intentionally manual: no push trigger, Apple integration, signing or publishing.
    environment:
      xcode: 26.4
    scripts:
      - name: Run Swift regressions in Debug and Release
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          mkdir -p build/preflight
          python3 Tools/test_privacy_plist.py
          python3 Tools/test_bundled_assets.py \
            --assets CineAR/RoomAssets \
            --manifest CineAR/RoomAssets/MANIFEST.sha256 \
            --prop-kind CineAR/PropKind.swift
          python3 Tools/validate_privacy_plist.py \
            --plist CineAR/Info.plist \
            --expected-bundle-id com.cinear.virtualproduction
          python3 Tools/run_swift_regressions.py --swiftc "$(xcrun --find swiftc)" \
            2>&1 | tee build/preflight/swift-tests.log

      - name: Build Release for iPhone without signing
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcodebuild build \
            -project CineAR.xcodeproj \
            -scheme CineAR \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/preflight/DerivedData \
            -resultBundlePath build/preflight/iOSBuild.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/preflight/ios-build.log

          app_plist="$(find build/preflight/DerivedData/Build/Products/Release-iphoneos \
            -path '*/CineAR.app/Info.plist' -print -quit)"
          if [[ -z "$app_plist" ]]; then
            echo "Unsigned CineAR.app Info.plist not found" >&2
            exit 1
          fi
          python3 Tools/validate_privacy_plist.py \
            --plist "$app_plist" \
            --expected-bundle-id com.cinear.virtualproduction
          python3 Tools/test_bundled_assets.py \
            --assets "$(dirname "$app_plist")/RoomAssets" \
            --manifest CineAR/RoomAssets/MANIFEST.sha256
    artifacts:
      - build/preflight/*.log
      - build/preflight/*.xcresult

  cinear-testflight:
    name: CineAR - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Apple

    environment:
      groups:
        # Codemagic UI'da Secret olmasi gerekmez:
        # APP_STORE_APPLE_ID
        - cinear_config

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cinear.virtualproduction

      vars:
        BUNDLE_ID: "com.cinear.virtualproduction"
        XCODE_PROJECT: "CineAR.xcodeproj"
        XCODE_SCHEME: "CineAR"
      xcode: 26.4

    scripts:
      - name: Validate project and required variables
        script: |
          #!/bin/bash
          set -euo pipefail

          required_variables=(
            APP_STORE_APPLE_ID
          )

          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing Codemagic environment variable: ${variable_name}" >&2
              exit 1
            fi
          done

          if [[ ! "$APP_STORE_APPLE_ID" =~ ^[0-9]+$ ]]; then
            echo "APP_STORE_APPLE_ID must be the numeric Apple ID from App Store Connect." >&2
            exit 1
          fi

          info_plist="$CM_BUILD_DIR/CineAR/Info.plist"
          if /usr/libexec/PlistBuddy -c "Print :CineARAppStoreID" "$info_plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CineARAppStoreID $APP_STORE_APPLE_ID" "$info_plist"
          else
            /usr/libexec/PlistBuddy -c "Add :CineARAppStoreID string $APP_STORE_APPLE_ID" "$info_plist"
          fi

          if [[ ! -d "$CM_BUILD_DIR/$XCODE_PROJECT" ]]; then
            echo "Xcode project not found: $CM_BUILD_DIR/$XCODE_PROJECT" >&2
            exit 1
          fi

          build_settings="$(
            xcodebuild \
              -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -showBuildSettings
          )"
          project_bundle_id="$(
            awk -F ' = ' \
              '/^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = / && !found { print $2; found=1 }' \
              <<< "$build_settings"
          )"

          if [[ "$project_bundle_id" != "$BUNDLE_ID" ]]; then
            echo "Bundle ID mismatch. Project: ${project_bundle_id:-not found}; workflow: $BUNDLE_ID" >&2
            exit 1
          fi

          python3 "$CM_BUILD_DIR/Tools/test_privacy_plist.py"
          python3 "$CM_BUILD_DIR/Tools/test_bundled_assets.py" \
            --assets "$CM_BUILD_DIR/CineAR/RoomAssets" \
            --manifest "$CM_BUILD_DIR/CineAR/RoomAssets/MANIFEST.sha256" \
            --prop-kind "$CM_BUILD_DIR/CineAR/PropKind.swift"
          python3 "$CM_BUILD_DIR/Tools/validate_privacy_plist.py" \
            --plist "$info_plist" \
            --expected-bundle-id "$BUNDLE_ID"

      - name: Test wall cladding geometry
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          wall_test_dir="$(mktemp -d)"
          xcrun swiftc -D WALL_GEOMETRY_TESTS \
            CineAR/WallCladdingGeometry.swift Tools/test_wall_cladding_geometry.swift \
            -o "$wall_test_dir/wall-cladding-tests"
          "$wall_test_dir/wall-cladding-tests"

      - name: Test live LiDAR occlusion geometry
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          depth_test_dir="$(mktemp -d)"
          xcrun swiftc CineAR/LiveDepthGeometry.swift Tools/test_live_depth_geometry.swift \
            -o "$depth_test_dir/live-depth-tests"
          "$depth_test_dir/live-depth-tests"

      - name: Test scan approval and wall contact
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          spatial_test_dir="$(mktemp -d)"
          xcrun swiftc CineAR/SpatialValidation.swift Tools/test_spatial_validation.swift \
            -o "$spatial_test_dir/spatial-tests"
          "$spatial_test_dir/spatial-tests"

      - name: Apply provisioning profile for internal TestFlight
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Increment build number from App Store Connect
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          set +e
          latest_build_output="$(
            # Keep diagnostic logs on stderr; stdout contains only the build number.
            app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" \
              --platform IOS \
              --all-versions
          )"
          latest_build_status=$?
          set -e

          if [[ $latest_build_status -ne 0 ]]; then
            echo "App Store Connect build number query failed." >&2
            exit "$latest_build_status"
          fi

          latest_build_number="$(
            printf '%s' "$latest_build_output" | tr -d '[:space:]'
          )"

          if [[ -z "$latest_build_number" ]]; then
            latest_build_number=0
            echo "No existing App Store Connect build found; starting at build 1."
          elif [[ ! "$latest_build_number" =~ ^[0-9]+$ ]]; then
            echo "App Store Connect returned an invalid build number: $latest_build_output" >&2
            exit 1
          fi

          next_build_number="$((10#$latest_build_number + 1))"
          xcrun agvtool new-version -all "$next_build_number"
          echo "CineAR build number: $next_build_number"

      - name: Build Release archive and IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --clean

      - name: Verify privacy descriptions and offline assets in archive and IPA
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          archive_plist="$(find build/ios/xcarchive \
            -path '*/Products/Applications/CineAR.app/Info.plist' -print -quit)"
          if [[ -z "$archive_plist" ]]; then
            echo "Archived CineAR.app Info.plist not found" >&2
            exit 1
          fi
          python3 Tools/validate_privacy_plist.py \
            --plist "$archive_plist" \
            --expected-bundle-id "$BUNDLE_ID"
          python3 Tools/test_bundled_assets.py \
            --assets "$(dirname "$archive_plist")/RoomAssets" \
            --manifest CineAR/RoomAssets/MANIFEST.sha256

          ipa_path="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "CineAR IPA not found" >&2
            exit 1
          fi
          ipa_check_dir="$(mktemp -d)"
          unzip -q "$ipa_path" -d "$ipa_check_dir"
          ipa_plist="$(find "$ipa_check_dir/Payload" \
            -path '*/CineAR.app/Info.plist' -print -quit)"
          if [[ -z "$ipa_plist" ]]; then
            echo "Packaged CineAR.app Info.plist not found in IPA" >&2
            exit 1
          fi
          python3 Tools/validate_privacy_plist.py \
            --plist "$ipa_plist" \
            --expected-bundle-id "$BUNDLE_ID"
          python3 Tools/test_bundled_assets.py \
            --assets "$(dirname "$ipa_plist")/RoomAssets" \
            --manifest CineAR/RoomAssets/MANIFEST.sha256

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Keep App Store production review disabled, but explicitly publish every
        # manually started build to the internal TestFlight group.
        submit_to_testflight: true
        beta_groups:
          - CineAR Internal Testers
        submit_to_app_store: false
